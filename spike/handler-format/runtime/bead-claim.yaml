on: command.run
where:
  is_error: false
  head: bd
  argv.1: update
  any:
    - argv: { contains: --claim }
    - argv: { any_matches: '^--status[= ]?in_progress$' }
    - argv: { followed_by: [--status, in_progress] }
each: { field: argv, from: 2, matches: '^[a-z]+-[a-z0-9]+(\.[0-9]+)*$', as: bead }
emit:
  stage: '${bead}'
  to_status: in_progress
