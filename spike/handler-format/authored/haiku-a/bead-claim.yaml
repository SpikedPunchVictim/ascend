# bead-claim
on: command.run
where:
  ok: true
  head: bd
  argv.1: update
  any:
    - argv: { contains: '--claim' }
    - argv: { any_matches: '^--status[= ]?in_progress$' }
    - argv: { followed_by: ['--status', 'in_progress'] }
each:
  field: argv
  from: 0
  matches: '^[a-z]+-[a-z0-9]+(\.[0-9]+)*$'
  as: id
emit:
  stage: '${id}'
  to_status: in_progress
